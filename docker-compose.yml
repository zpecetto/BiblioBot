version: "3.8"

volumes:
  n8n_data:
    # Volume standard géré par Docker pour stocker la base de données n8n de l'utilisateur

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_librarian
    restart: unless-stopped
    ports:
      - "5678:5678"
    extra_hosts:
      # Permet à n8n de communiquer avec une instance Ollama installée directement sur l'hôte (PC/Raspberry Pi)
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_BROWSER_NAME_CHECK=true
      - NODE_FUNCTION_ALLOW_BUILTIN=* # Indispensable pour l'exécution des nœuds Code complexes
      # - WEBHOOK_URL=https://votre-url-publique.com/ # À décommenter si l'utilisateur utilise Ngrok ou un Reverse Proxy
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - browserless

  # Le navigateur Headless utilisé pour le Web Scraping (Bypass des protections Cloudflare / Lazy Loading)
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless_scraper
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Optimisations cruciales pour des machines avec RAM limitée (ex: Raspberry Pi)
      - MAX_CONCURRENT_SESSIONS=3 
      - MAX_QUEUE_LENGTH=5
      - ENABLE_DEBUGGER=false